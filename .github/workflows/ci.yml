name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: live
          POSTGRES_PASSWORD: live
          POSTGRES_DB: live_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U live" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        env:
          TEST_DATABASE_URL: postgres://live:live@localhost:5432/live_test?sslmode=disable
        run: go test -race ./...
      - name: build
        run: go build ./...
